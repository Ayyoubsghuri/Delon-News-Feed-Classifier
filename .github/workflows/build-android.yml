name: Build Android app (Delon.apk)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delon-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delon-frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build React UI
        env:
          CI: "false"
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          # Allow plain-http servers on the local network (e.g. http://192.168.1.20:5000)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: App icon & splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath ../assets

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Delon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Delon-android
          path: delon-frontend/Delon.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: delon-frontend/Delon.apk
