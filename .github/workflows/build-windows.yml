name: Build Windows app (Delon.exe)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delon-frontend/package-lock.json

      - name: Build React UI
        working-directory: delon-frontend
        env:
          CI: "false"
        run: |
          npm ci
          npm run build

      - name: Copy UI into backend
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          Copy-Item delon-frontend/build build -Recurse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-desktop.txt

      - name: Build Delon.exe
        run: pyinstaller --noconfirm delon.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Delon-windows
          path: dist/Delon.exe

      - name: Read version
        id: version
        shell: bash
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Publishes (or updates) the GitHub release v<VERSION> with this build.
      - name: Publish to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Delon v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **Delon v${{ steps.version.outputs.version }}**

            - `Delon.apk` — standalone Android app (works without a PC or server). Allow "Install unknown apps" to install it.
            - `Delon.exe` — Windows app (backend + reader in one window).
          files: dist/Delon.exe
